<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="InboxPilot turns your inbox into a prioritised task list." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>InboxPilot</title>
    <script>
      // apply the saved theme before first paint (no flash)
      try {
        var ui = JSON.parse(localStorage.getItem("inboxpilot-ui") || "{}").state || {};
        var t = ui.theme || "system";
        // colour theme before first paint (no flash); "inbox" is the base CSS
        if (/^[a-z-]{1,20}$/.test(ui.palette || "") && ui.palette !== "inbox") {
          document.documentElement.dataset.palette = ui.palette;
        }
        var dark =
          t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /healthz { access_log off; return 200 "ok\n"; }

  # Docker's DNS, re-checked every 10 s: nginx otherwise resolves "api" once at startup and
  # keeps calling the old address (502 Bad Gateway) after the api container restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # API + SSE through the same origin
  location /api/ {
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;          # stream server-sent events immediately
    proxy_read_timeout 1h;
  }

  # hashed assets can be cached for a year; index.html never.
  # (`expires`, not add_header: an add_header here would drop the security headers above)
  location /assets/ {
    expires 1y;
  }
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
